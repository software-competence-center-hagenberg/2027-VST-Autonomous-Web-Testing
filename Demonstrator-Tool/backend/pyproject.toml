[project]
name = "agent-testing-backend"
version = "1.0.0"
description = "FastAPI backend for running and observing multi-agent web-testing configurations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "browser-use[video]==0.13.10",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
autogen = [
    "pyautogen>=0.2.25,<0.3",
    "playwright>=1.42",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["agents", "main.py", "task_manager.py", "schemas.py", "events.py"]
